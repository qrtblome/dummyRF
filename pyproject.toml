[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dummyrf"
version = "0.1.0"
description = "RF manager for Shure and Sennheiser wireless: remote control, frequency coordination, scans"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "pyqtgraph>=0.13", "numpy>=1.26", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dummyrf = "dummyrf.gui.app:main"

[tool.setuptools.packages.find]
include = ["dummyrf*"]

[tool.setuptools.package-data]
dummyrf = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
